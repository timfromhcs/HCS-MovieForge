name: Sync Hugging Face Space Demo

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/space-demo/**'

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push apps/space-demo to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set in repository; skipping sync."
            exit 0
          fi
          python -m pip install --upgrade pip
          pip install huggingface_hub
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.upload_folder(
              folder_path="apps/space-demo",
              repo_id="timfromhcs/HCS-MovieForge",
              repo_type="space",
              commit_message="ci(space-sync): sync demo adapter from main repo",
              allow_patterns=["app.py", "space_status.py", "requirements.txt", "README.md"],
          )
          print("synced commit:", info.oid)
          EOF
