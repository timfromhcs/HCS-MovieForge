[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcs-movieforge"
version = "0.1.0"
description = "Autonomous local-first AI filmmaking workstation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Tim from HCS", email = "timfromhcs@gmail.com" }
]
license = { text = "MIT" }
keywords = ["ai", "filmmaking", "vulkan", "blender", "trellis", "flux", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "huggingface_hub>=0.23.0",
    "pillow>=10.3.0",
    "click>=8.1.7",
    "psutil>=5.9.8",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
movieforge = "apps.cli.src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "agent*", "integrations*", "packages*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
